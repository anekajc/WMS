worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        # ajcwms dilayani dari ROOT folder proyek, sama seperti Apache produksi lama
        # (index.php + .htaccess di root). Semua view memanggil aset "public/..." dan "img/...",
        # jadi root nginx = folder proyek. Supaya .env, app/, storage/, vendor/ dll TIDAK bisa
        # diunduh, hanya folder aset yang dilayani langsung; sisanya diteruskan ke index.php.
        root /var/www/html;
        index index.php;

        # File tersembunyi (.env, .git, .htaccess) - tolak.
        location ~ /\. {
            deny all;
            return 404;
        }

        # Aset statis: public/ dan img/ (dipanggil langsung oleh view).
        location ^~ /public/ {
            location ~ \.php$ { return 404; }
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        location ^~ /img/ {
            location ~ \.php$ { return 404; }
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        # Satu-satunya file PHP yang boleh dijalankan langsung: index.php di root
        # (yang memuat public/index.php - sama dengan produksi lama).
        location = /index.php {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
            include        fastcgi_params;
            # nginx Debian mengisi HTTP_HOST tanpa port - Laravel lalu membangun URL tanpa port.
            fastcgi_param  HTTP_HOST $http_host;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 32k;
            fastcgi_buffer_size 64k;
        }

        location ~ \.php$ {
            return 404;
        }

        # Selain itu: file yang ada di public/ (mis. /favicon.ico, /js/jquery.js) dilayani
        # seperti server.php/index.php root, sisanya ke Laravel.
        location / {
            try_files /public$uri /index.php?$query_string;
        }
    }
}
